<!doctype html>
<html lang="ar" dir="rtl" data-bs-theme="light">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ملفات PDF | جرب صوتك</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/admin_dashboard.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/sidebar.css') }}" rel="stylesheet">
</head>
<body class="with-sidebar" data-role="admin">
{% include 'admin/sidebar.html' %}
<main class="container py-4" id="pdfPage" data-api="{{ pdf_api }}">
    <h1 class="h3">ملفات PDF — {{ pdf_user['full_name'] }}</h1>
    <p>الملفات الخاصة متاحة لصاحب الحساب والإدارة فقط. النصوص المشتركة متاحة لجميع الحسابات المسجلة.</p>
    {% if not own_files %}<a class="btn btn-outline-dark mb-3" href="{{ url_for('admin.pages', section='contestants') }}">العودة إلى المتسابقين</a>{% endif %}
    <section class="card mb-4"><div class="card-body">
        <h2 class="h5">رفع ملف خاص</h2>
        <form id="privatePdfForm" class="form-panel">
            <label for="privatePdfName" class="form-label">اسم النص</label>
            <input id="privatePdfName" class="form-control mb-3" maxlength="150" required>
            <label for="privatePdfFile" class="form-label">ملف PDF — بحد أقصى 10 ميغابايت</label>
            <input id="privatePdfFile" type="file" accept=".pdf,application/pdf" class="form-control mb-3" required>
            <button id="privatePdfSubmit" class="btn btn-primary" type="submit">رفع الملف</button>
        </form>
        <div id="privatePdfAlert" class="alert d-none mt-3" role="status" aria-live="polite"></div>
    </div></section>
    <section class="card"><div class="card-body">
        <div class="d-flex justify-content-between mb-3"><h2 class="h5">الملفات المتاحة</h2><button id="privatePdfRefresh" class="btn btn-outline-dark" type="button">تحديث</button></div>
        <p id="privatePdfStatus" role="status" aria-live="polite"></p>
        <div class="table-responsive"><table class="table"><thead><tr><th scope="col">الاسم</th><th scope="col">النوع</th><th scope="col">تاريخ الرفع</th><th scope="col">الملف</th></tr></thead><tbody id="privatePdfRows"></tbody></table></div>
    </div></section>
</main>
<script src="{{ url_for('static', filename='js/private_pdfs.js') }}"></script>
</body></html>
