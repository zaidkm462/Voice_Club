<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>جرّب صوتك - تسجيل الدخول</title>

    <!-- Bootstrap 5 RTL -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css"
        rel="stylesheet"
    >

    <!-- Cairo -->
    <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>

<body>
    <main class="login-page">
        <div class="login-wrapper">

            <section class="brand-section" aria-label="جرّب صوتك">
                <img
                    src="{{ url_for('static', filename='images/logo.jpg') }}"
                    alt="شعار جرّب صوتك"
                    class="brand-logo"
                >

                <div class="brand-description">
                    <h1>جرّب صوتك</h1>
                </div>
            </section>

            <section class="login-section" aria-labelledby="loginTitle">
                <div class="login-content">

                    <div class="welcome-text">
                        <h2 id="loginTitle">مرحباً بعودتك</h2>
                        <p>سجّل الدخول للمتابعة</p>
                    </div>

                    <form id="loginForm" novalidate>

                        <div class="form-field">
                            <label for="username">اسم المستخدم</label>

                            <div class="input-wrapper">
                                <i class="bi bi-person input-icon" aria-hidden="true"></i>

                                <input
                                    type="text"
                                    id="username"
                                    name="username"
                                    class="form-control custom-input"
                                    placeholder="ادخل اسم المستخدم"
                                    autocomplete="username"
                                    required
                                >
                            </div>
                        </div>

                        <div class="form-field">
                            <label for="password">كلمة المرور</label>

                            <div class="input-wrapper">
                                <i class="bi bi-lock input-icon" aria-hidden="true"></i>

                                <input
                                    type="password"
                                    id="password"
                                    name="password"
                                    class="form-control custom-input password-input"
                                    placeholder="ادخل كلمة المرور"
                                    autocomplete="current-password"
                                    required
                                >

                                <button
                                    type="button"
                                    id="togglePassword"
                                    class="password-toggle"
                                    aria-label="إظهار كلمة المرور"
                                    aria-pressed="false"
                                >
                                    <i class="bi bi-eye-slash" aria-hidden="true"></i>
                                </button>
                            </div>
                        </div>


                        <div
                            id="errorMessage"
                            class="alert alert-danger error-message"
                            role="alert"
                            aria-live="polite"
                        ></div>

                        <button type="submit" id="loginButton" class="login-button">
                            <span class="button-text">تسجيل الدخول</span>
                            <span class="button-icon" aria-hidden="true">
                                <i class="bi bi-chevron-left"></i>
                            </span>
                            <span class="button-spinner spinner-border spinner-border-sm" aria-hidden="true"></span>
                        </button>
                    </form>

                    <div class="support-section">
                        <div class="support-divider"></div>

                        <a href="#" class="support-link">
                            <span>جميع الحقوق محفوظة</span>
                            <span class="support-action">نادي جرب صوتك</span>
                            <i class="fa fa-copyright" aria-hidden="true"></i>
                        </a>
                    </div>

                </div>
            </section>

        </div>
    </main>

    <script src="{{ url_for('static', filename='js/login.js') }}"></script>
</body>
</html>
