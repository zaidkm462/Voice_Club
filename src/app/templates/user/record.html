<!DOCTYPE html>
<html lang="ar" dir="rtl" data-bs-theme="light">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>جرب صوتك | تسجيل جديد</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/user_record.css') }}">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" defer></script>
<script src="{{ url_for('static', filename='js/user_record.js') }}" defer></script>
<!-- نفس مستعرض PDFlipbook المستخدم في منصة العرض بلوحة المستخدم -->
<script src="/static/js/pdflipbook.js"></script>
</head>
<body>

<!-- ===== منصة التسجيل: عرض PDF بتقليب الصفحات + تسجيل صوتي ===== -->
<div id="reader" data-recording-count="{{ recording_count }}" data-max-records="{{ max_record_uploads }}">
  <header class="rd-top d-flex flex-wrap align-items-center gap-2 px-3 px-lg-4 py-2">
    <a href="#" class="btn btn-line" id="rdBack" onclick="history.back();return false;"><i class="bi bi-arrow-right"></i><span class="d-none d-sm-inline"> رجوع</span></a>
    <button class="btn btn-line" id="btnUpload"><i class="bi bi-upload"></i><span class="d-none d-sm-inline"> رفع PDF</span></button>
    <button class="btn btn-line" id="btnChoose"><i class="bi bi-collection"></i><span class="d-none d-sm-inline"> اختيار PDF</span></button>
    <span class="mute flex-grow-1 text-center text-truncate" id="pgInfo"></span>
    <button class="btn btn-gold" id="btnSave" disabled><i class="bi bi-cloud-arrow-up"></i><span class="d-none d-sm-inline"> حفظ التسجيل</span></button>
  </header>

  <div class="rd-stage">
    <div id="stage"></div>
    <div id="rdLoad" class="rd-load d-none"></div>

    <!-- الحالة الفارغة قبل اختيار ملف -->
    <div id="rdEmpty" class="rd-empty">
      <i class="bi bi-file-earmark-pdf"></i>
      <p class="fs-5 fw-bold mb-1">لم تختر ملف PDF بعد</p>
      <p class="mute mb-4">ارفع ملفاً من جهازك أو اختر واحداً من المكتبة لتبدأ التسجيل</p>
      <p id="recordLimitMessage" class="fs-5 fw-bold text-danger d-none">لقد تجاوزت عدد التسجيلات</p>
      <div class="d-flex gap-2 flex-wrap justify-content-center">
        <button class="btn btn-gold" id="btnUpload2"><i class="bi bi-upload"></i> رفع PDF</button>
        <button class="btn btn-line" id="btnChoose2"><i class="bi bi-collection"></i> اختيار من المكتبة</button>
      </div>
    </div>

    <button id="pgPrev" class="rd-arrow prev" aria-label="الصفحة السابقة"><i class="bi bi-chevron-left"></i></button>
    <button id="pgNext" class="rd-arrow next" aria-label="الصفحة التالية"><i class="bi bi-chevron-right"></i></button>
  </div>

  <!-- ===== لوحة التسجيل الصوتي ===== -->
  <footer class="rd-dock"><div class="mx-auto" style="max-width:40rem">
    <div class="wave rec-wave" id="pWave" aria-hidden="true"></div>
    <div class="d-flex align-items-center justify-content-between gap-3">
      <div class="d-flex align-items-center gap-2" style="min-width:6.5rem">
        <span class="rec-dot" id="recDot"></span>
        <span class="tnow" dir="ltr" id="tNow">0:00</span>
      </div>
      <div class="d-flex align-items-center gap-3">
        <button class="btn btn-line rec-side" id="btnRedo" title="إعادة التسجيل" disabled><i class="bi bi-arrow-counterclockwise"></i></button>
        <button class="rec-main" id="btnRec" title="بدء التسجيل" disabled><i class="bi bi-mic-fill"></i></button>
        <button class="btn btn-line rec-side" id="btnPlay" title="استماع" disabled><i class="bi bi-play-fill"></i></button>
      </div>
      <span class="mute" style="min-width:6.5rem;text-align:left" id="recHint">اختر PDF أولاً</span>
    </div>
  </div></footer>
</div>

<!-- إدخال ملف مخفي -->
<input type="file" id="pdfFileInput" accept="application/pdf" class="d-none">

<!-- مودال: تسمية الملف المرفوع -->
<div class="modal fade" id="nameModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered"><div class="modal-content p-2">
    <div class="modal-body">
      <h2 class="fs-4 fw-bolder mb-3"><i class="bi bi-filetype-pdf" style="color:var(--gold)"></i> تسمية الملف</h2>
      <label class="form-label mute" for="pdfNameInput">اسم الملف</label>
      <input type="text" class="form-control form-control-lg" id="pdfNameInput" placeholder="مثال: قصة الأرنب الصغير">
      <div class="d-flex gap-2 mt-4">
        <button class="btn btn-line flex-fill" data-bs-dismiss="modal">إلغاء</button>
        <button class="btn btn-gold flex-fill" id="nameOk"><i class="bi bi-check2"></i> تحميل وعرض</button>
      </div>
    </div>
  </div></div>
</div>

<!-- مودال: اختيار PDF من المكتبة -->
<div class="modal fade" id="chooseModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-lg"><div class="modal-content p-2">
    <div class="modal-body">
      <div class="d-flex align-items-center justify-content-between mb-3">
        <h2 class="fs-4 fw-bolder mb-0"><i class="bi bi-collection" style="color:var(--gold)"></i> اختر ملف PDF</h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="إغلاق"></button>
      </div>
      <div class="input-group mb-3">
        <span class="input-group-text bg-transparent border-end-0"><i class="bi bi-search"></i></span>
        <input type="search" class="form-control border-start-0" id="pdfSearch" placeholder="ابحث باسم الملف…">
      </div>
      <div id="pdfLibLoad" class="text-center py-5 mute"><div class="spinner-border mb-2" style="color:var(--gold)"></div><div>جارٍ جلب الملفات…</div></div>
      <div id="pdfLibEmpty" class="text-center py-5 mute d-none"><i class="bi bi-inboxes fs-1 d-block mb-2"></i>لا توجد نتائج مطابقة</div>
      <div id="pdfLibList" class="row row-cols-1 row-cols-sm-2 g-3" style="max-height:22rem;overflow-y:auto"></div>
    </div>
  </div></div>
</div>

<!-- إشعار -->
<div class="toast-container position-fixed start-50 translate-middle-x p-3" style="bottom:1.5rem;z-index:1090">
  <div id="toast" class="toast border-0" role="status" aria-live="polite"><div class="toast-body fs-6 d-flex align-items-center gap-2" id="toastMsg"></div></div>
</div>

</body>
</html>
